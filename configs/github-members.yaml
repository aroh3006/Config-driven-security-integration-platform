name: github-members
entity: user
mock: false
source:
  type: http
  base_url: https://api.github.com
  allow_hosts: [api.github.com]
auth:
  type: bearer
  secret: github_token
request:
  method: GET
  path: /orgs/YOUR-GITHUB-ORG/members
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2026-03-10"
  format: json
  records_path: ""
pagination:
  type: page_number
  page_param: page
  size_param: per_page
  size: 100
  start: 1
schedule: every 15m
retry: { delays_s: [1, 2, 4], jitter: false }
rate_limit: { max_rps: 2, remaining_header: X-RateLimit-Remaining, reset_header: X-RateLimit-Reset }
limits: { max_pages: 50, timeout_s: 30, max_response_mb: 20 }
map:
  id: id
  name: { coalesce: [name, login] }
  email: email
  status: { const: "active" }
required: [id]
notify: { slack_after_failures: 3 }
