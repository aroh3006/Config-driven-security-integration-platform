name: mock-edr-detections
entity: alert
mock: true
source:
  type: http
  base_url: http://localhost:9000
  allow_hosts: [localhost]
auth:
  type: oauth2_client_credentials
  token_url: http://localhost:9000/edr/oauth2/token
  client_id_secret: mock_edr_client_id
  client_secret_secret: mock_edr_client_secret
  send_as: body
request:
  method: GET
  path: /edr/alerts/combined/alerts/v1
  params: { limit: 100 }
  format: json
  records_path: resources
pagination:
  type: body_token
  token_path: meta.pagination.next
  token_param: after
  token_in: query
schedule: every 15m
retry: { delays_s: [1, 2, 4], jitter: false }
rate_limit: { max_rps: 2, remaining_header: X-Rate-Limit-Remaining, reset_header: X-Rate-Limit-Reset }
limits: { max_pages: 50, timeout_s: 5, max_response_mb: 20 }
map:
  id: id
  type: technique_id
  severity: { path: severity_name, transform: lower }
  timestamp: { path: created_timestamp, transform: to_utc }
  description: description
  cve: cve
notify: { slack_after_failures: 3 }
