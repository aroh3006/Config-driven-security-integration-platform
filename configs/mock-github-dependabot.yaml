name: mock-github-dependabot
entity: alert
mock: true
source:
  type: http
  base_url: http://localhost:9000/github
  allow_hosts: [localhost]
auth:
  type: bearer
  secret: mock_github_token
request:
  method: GET
  path: /repos/example-org/demo-service/dependabot/alerts
  params: { per_page: 20, state: open }
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2026-03-10"
  format: json
  records_path: ""
pagination:
  type: link_header
schedule: every 1h
retry: { delays_s: [1, 2, 4], jitter: false }
rate_limit: { max_rps: 2, remaining_header: X-RateLimit-Remaining, reset_header: X-RateLimit-Reset }
limits: { max_pages: 50, timeout_s: 5, max_response_mb: 20 }
map:
  id: number
  type: { const: "dependabot_alert" }
  severity: security_advisory.severity
  timestamp: { path: created_at, transform: to_utc }
  description: security_advisory.summary
  cve: security_advisory.cve_id
notify: { slack_after_failures: 3 }
