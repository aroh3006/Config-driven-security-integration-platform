{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "logo" %}
<path d="M5 12a7 7 0 0 1 14 0v2H5z" fill="currentColor" stroke="none"/><path d="M7 17v3M12 17v4M17 17v3"/>
{%- elif name == "home" %}
<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>
{%- elif name == "health" %}
<path d="M3 12h4l3-7 4 14 3-7h4"/>
{%- elif name == "live" %}
<path d="M9 3v5M15 3v5"/><path d="M7 8h10v4a5 5 0 0 1-10 0z"/><path d="M12 17v4"/>
{%- elif name == "sources" %}
<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>
{%- elif name == "configs" %}
<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>
{%- elif name == "data" %}
<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
{%- elif name == "quarantine" %}
<path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>
{%- elif name == "audit" %}
<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/>
{%- elif name == "plus" %}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "folder" %}
<path d="M3 7h6l2 2h10v10H3z"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro status(value) -%}
<span class="st t-{{ tone(value) }}"><i class="dot" aria-hidden="true"></i>{{ value }}</span>
{%- endmacro %}
